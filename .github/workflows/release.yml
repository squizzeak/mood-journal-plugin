name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Commit version/changelog and publish a GitHub release
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: mood-journal-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SELECTED_REF: ${{ github.ref }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and test
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -v
      - name: Check publish branch and capture all releases
        run: |
          if [ "$PUBLISH" = "true" ] && [ "$SELECTED_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo 'Publish only from the default branch.' >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/releases.json"
      - name: Prepare UTC version and incremental changelog
        run: |
          python3 scripts/release.py prepare --releases-json "$RUNNER_TEMP/releases.json"
          python3 scripts/validate.py
          python3 -c 'import json; print("RELEASE_TAG=" + json.load(open(".release/metadata.json"))["tag"])' >> "$GITHUB_ENV"
      - name: Commit release snapshot
        if: inputs.publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md plugins/mood-journal/plugin.json plugins/mood-journal/.codex-plugin/plugin.json
          git commit -m "chore(release): $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
      - name: Build and verify archives
        run: python3 scripts/release.py build
      - uses: actions/upload-artifact@v4
        with:
          name: mood-journal-release-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
      - name: Publish branch, tag, assets, and notes
        if: inputs.publish
        run: |
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Mood Journal $RELEASE_TAG" --notes-file dist/RELEASE-NOTES.md
          gh release upload "$RELEASE_TAG" dist/*
          gh release edit "$RELEASE_TAG" --draft=false
